server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/indomaret_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

# Custom App Configuration
app:
  pagination:
    default-page-size: 20
    max-page-size: 100
  whitelist:
    max-store-count: 50
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsLongEnoughForHS256Algorithm2024}
    expiration-ms: 3600000  # 1 hour

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
